<div class="input-wrapper" [class.has-error]="error">
  @if (label) { <label [for]="id" class="input-label">{{ label }}</label> }
  <div class="input-container">
    <input [id]="id" [type]="type" [placeholder]="placeholder" [value]="value()" [disabled]="disabled()"
      [attr.maxlength]="maxlength" [attr.min]="min" [attr.max]="max" [attr.step]="step" [attr.inputmode]="type === 'number' ? 'decimal' : null"
      [attr.aria-invalid]="!!error" [attr.aria-describedby]="error ? id + '-error' : null"
      (input)="handleInput($event)" (blur)="handleBlur()" class="input-field">
  </div>
  @if (error) { <span [id]="id + '-error'" class="input-error">{{ error }}</span> }
</div>
