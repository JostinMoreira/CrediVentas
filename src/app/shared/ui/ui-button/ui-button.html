<button
  [type]="type"
  [disabled]="disabled || isLoading"
  [ngClass]="[
    'btn',
    'btn-' + variant,
    'btn-' + size,
    fullWidth ? 'btn-full' : ''
  ]"
>
  <span *ngIf="isLoading" class="spinner"></span>
  <span class="content" [class.loading]="isLoading">
    <ng-content></ng-content>
  </span>
</button>
