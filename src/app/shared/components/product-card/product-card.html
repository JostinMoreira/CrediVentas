<article class="card">
  <div class="card-img-container">
    @if (product.imagenUrl) {
      <img [src]="product.imagenUrl" [alt]="product.nombre" loading="lazy">
    } @else {
      <div class="image-placeholder">Imagen próximamente</div>
    }
    <span class="category-badge">{{ product.categoria }}</span>
  </div>
  <div class="card-content">
    <h4 class="card-title">{{ product.nombre }}</h4>
    <p class="card-price">{{ product.precio | currency:'USD':'symbol':'1.2-2':'es-EC' }}</p>
    <a class="btn-whatsapp" [href]="whatsappUrl()" target="_blank" rel="noopener noreferrer" (click)="$event.stopPropagation()">
      Pedir por WhatsApp
    </a>
  </div>
</article>
