<div class="container animate-fade-in" style="padding-top: var(--space-8); padding-bottom: var(--space-12); max-width: 800px;">
  <div style="margin-bottom: var(--space-6);">
    <a routerLink="/admin" style="display: inline-block; margin-bottom: var(--space-4); font-weight: 600;">
      ← Volver al panel
    </a>
    <h1 style="margin-bottom: var(--space-2);">Añadir Producto</h1>
    <p class="text-muted">Ingresa la información necesaria para publicar el producto en el catálogo digital.</p>
  </div>

  <div class="glass-card">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: var(--space-6);">
      
      <!-- Nombre del Producto -->
      <app-ui-input
        formControlName="nombre"
        label="Nombre del Producto"
        placeholder="Ej: Tractor Agrícola 75 HP / Nevera 400L"
        [error]="isFieldInvalid('nombre') ? 'El nombre del producto es obligatorio.' : ''">
      </app-ui-input>

      <!-- Categoría -->
      <div style="display: flex; flex-direction: column; gap: var(--space-2);">
        <label for="categoria" class="input-label">Categoría</label>
        <select
          id="categoria"
          formControlName="categoria"
          class="custom-select"
          [class.has-error]="isFieldInvalid('categoria')"
        >
          <option value="" disabled>Selecciona una categoría</option>
          <option value="Maquinaria Agrícola">Maquinaria Agrícola</option>
          <option value="Electrodomésticos">Electrodomésticos</option>
          <option value="Tecnología">Tecnología</option>
          <option value="Hogar">Hogar</option>
        </select>
        <span *ngIf="isFieldInvalid('categoria')" class="error-text">Debes seleccionar una categoría.</span>
      </div>

      <!-- Precio -->
      <app-ui-input
        formControlName="precio"
        label="Precio ($)"
        type="number"
        placeholder="Ej: 3500000"
        [error]="isFieldInvalid('precio') ? 'Ingresa un precio válido (mayor a 0).' : ''">
      </app-ui-input>

      <!-- Estado -->
      <div style="display: flex; flex-direction: column; gap: var(--space-2);">
        <label for="estado" class="input-label">Estado</label>
        <select
          id="estado"
          formControlName="estado"
          class="custom-select"
          [class.has-error]="isFieldInvalid('estado')"
        >
          <option value="Activo">Activo</option>
          <option value="Oculto">Oculto</option>
        </select>
        <span *ngIf="isFieldInvalid('estado')" class="error-text">El estado es obligatorio.</span>
      </div>

      <!-- Imagen del Producto (Archivo) -->
      <div style="display: flex; flex-direction: column; gap: var(--space-2);">
        <label for="imagen" class="input-label">Imagen del Producto</label>
        <div class="file-drop-area">
          <input
            id="imagen"
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            style="width: 100%; padding: var(--space-3);"
          />
        </div>
        <span *ngIf="!selectedFile && productForm.touched" class="error-text">Debes seleccionar una imagen.</span>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--color-border); margin: var(--space-4) 0;">

      <!-- Botón Submit -->
      <div style="display: flex; justify-content: flex-end;">
        <app-ui-button type="submit" variant="accent" size="lg" [isLoading]="isSubmitting">
          Guardar Producto
        </app-ui-button>
      </div>
    </form>
  </div>
</div>
